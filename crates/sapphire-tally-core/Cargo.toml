[package]
name = "sapphire-tally-core"
edition.workspace = true
version = "0.2.0"
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["filesystem", "data-structures"]
keywords = ["tracker", "heatmap", "habit", "plain-text"]

[features]
default = ["redb-store"]
redb-store = ["sapphire-workspace/redb-store"]

[dependencies]
jiff.workspace = true
grain-id = { workspace = true, features = ["schemars"] }
sapphire-frontmatter.workspace = true
sapphire-workspace.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
