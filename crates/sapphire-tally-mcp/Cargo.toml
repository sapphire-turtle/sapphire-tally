[package]
name = "sapphire-tally-mcp"
version = "0.1.0"
edition.workspace = true
description = "MCP tools for sapphire-tally: the tally's methods on its app server, and the tools that call them"
license.workspace = true
repository.workspace = true
keywords = ["tracker", "heatmap", "mcp"]

[features]
default = ["redb-store"]
redb-store = ["sapphire-tally-core/redb-store"]

[dependencies]
sapphire-tally-core = { path = "../sapphire-tally-core", version = "0.1.0", default-features = false }
sapphire-framework = { workspace = true, features = ["ipc", "mcp"] }
anyhow.workspace = true
chrono.workspace = true
grain-id.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
