[package]
name = "sapphire-tally"
version = "0.1.0"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
categories = ["command-line-utilities"]
keywords = ["tracker", "heatmap", "cli", "mcp"]

[lib]
name = "sapphire_tally"
path = "src/lib.rs"

[[bin]]
name = "sapphire-tally"
path = "src/main.rs"

[features]
default = ["redb-store"]
redb-store = [
    "sapphire-tally-core/redb-store",
    "sapphire-tally-mcp/redb-store",
    "sapphire-framework/redb-store",
]

[dependencies]
sapphire-tally-core = { path = "../crates/sapphire-tally-core", version = "0.1.0", default-features = false }
sapphire-tally-mcp = { path = "../crates/sapphire-tally-mcp", version = "0.1.0", default-features = false }
sapphire-framework = { workspace = true, features = ["server", "ipc", "mcp"] }
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# `cargo binstall sapphire-tally` downloads the release file instead of building it, following
# sapphire-framework's ci/README.md#conventions: the files are bare binaries named
# `<binary>-<os>-<arch>`, so each release platform names its own. quick-install is a third
# party's build: only this repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"
