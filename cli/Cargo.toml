[package]
name = "sapphire-tally"
version = "0.1.0"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["tracker", "heatmap", "cli", "mcp"]
publish = false

[lib]
name = "sapphire_tally"
path = "src/lib.rs"

[[bin]]
name = "sapphire-tally"
path = "src/main.rs"

[features]
default = ["redb-store"]
redb-store = [
    "sapphire-tally-core/redb-store",
    "sapphire-tally-mcp/redb-store",
    "sapphire-framework/redb-store",
]

[dependencies]
sapphire-tally-core = { path = "../crates/sapphire-tally-core", version = "0.1.0", default-features = false }
sapphire-tally-mcp = { path = "../crates/sapphire-tally-mcp", version = "0.1.0", default-features = false }
sapphire-framework = { workspace = true, features = ["server", "ipc", "mcp"] }
sapphire-bridge-client.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
