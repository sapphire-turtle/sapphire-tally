[package]
name = "sapphire-tally-desktop"
version = "0.1.0"
edition.workspace = true
description = "Desktop GUI for sapphire-tally"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `eframe`: `gui::app::run` starts the window, and `gui::{eframe, egui}` are the
# versions it renders with.
sapphire-framework = { workspace = true, features = ["eframe", "ipc"] }
# The record types the server's answers deserialize into, and the methods'
# parameters and names. No store: the desktop reads nothing from disk.
sapphire-tally-core = { path = "../crates/sapphire-tally-core", version = "0.1.0", default-features = false }
sapphire-tally-mcp = { path = "../crates/sapphire-tally-mcp", version = "0.1.0", default-features = false }
chrono.workspace = true
grain-id.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing.workspace = true

[dev-dependencies]
# The real server, for the client test: `serve::build()`.
sapphire-tally = { path = "../cli", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
