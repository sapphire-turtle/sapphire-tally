[package]
name = "sapphire-tally-desktop"
# Released together with `sapphire-tally-headless`, under its `v{version}`
# tags (release-plz.toml).
version = "0.2.0"
edition.workspace = true
description = "Desktop GUI for sapphire-tally"
license-file = "LICENSE"
repository.workspace = true
publish = false

[[bin]]
name = "sapphire-tally-desktop"
path = "src/main.rs"

# The Windows console shim the package puts on `PATH` as `sapphire-tally.exe`
# (src/bin/console.rs).
[[bin]]
name = "sapphire-tally-console"
path = "src/bin/console.rs"
required-features = ["package"]

[features]
# The release workflow's build: the package's start, its updater, its first run
# and its service (src/package.rs). `cargo build` makes the plain binary.
package = ["sapphire-framework/package"]

[dependencies]
# Every command but the window — `serve`, `mcp`, `status`, `workspace`, … —
# runs the CLI's own code, so this one binary does all the CLI does.
sapphire-tally-cli = { path = "../crates/sapphire-tally-cli", version = "0.2.0" }
# `eframe`: `gui::app::run` starts the window, and `gui::{eframe, egui}` are the
# versions it renders with.
sapphire-framework = { workspace = true, features = ["eframe", "ipc", "server"] }
# The window's icon and app-menu entry (`LauncherSpec`'s icon), and whether this runs in a
# package; the framework's version of it.
corundum-framework-platform = "0.8.0"
# The record types the server's answers deserialize into, and the methods'
# parameters and names. No store: the window reads nothing from disk.
sapphire-tally-core = { path = "../crates/sapphire-tally-core", version = "0.1.1", default-features = false }
sapphire-tally-mcp = { path = "../crates/sapphire-tally-mcp", version = "0.2.0", default-features = false }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
grain-id.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing.workspace = true

[dev-dependencies]
# The real server, for the client test: `sapphire_tally_server::build()`.
sapphire-tally-server = { path = "../crates/sapphire-tally-server", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }

[build-dependencies]
# The app icon in the Windows executable (`build.rs`).
corundum-framework-build = "0.9.1"

# The package (sapphire-turtle/.github's release-packager.yml, corundum-framework#103): the
# window's binary, built with the `package` feature; the release workflow adds the Windows
# console shim as `sapphire-tally.exe`. The product name is the launcher's (`LauncherSpec::name`), so
# the installer's shortcut and the launcher's entry coincide. The icons are rendered into
# `icons/` by the `icons` example before packaging.
[package.metadata.packager]
productName = "Sapphire Tally"
identifier = "org.sapphire-turtle.sapphire-tally"
category = "Utility"
binaries = [{ path = "sapphire-tally-desktop", main = true }]
icons = ["icons/icon.png", "icons/icon.icns", "icons/icon.ico"]

# `cargo binstall --git https://github.com/sapphire-turtle/sapphire-tally sapphire-tally-desktop`
# downloads the release file instead of building it (this crate is not on crates.io), following
# sapphire-turtle/.github's README.md#conventions: the files are bare binaries named
# `<binary>-<os>-<arch>`, so each release platform names its own. quick-install is a third
# party's build: only this repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"
