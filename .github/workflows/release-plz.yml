name: Release-plz

# The CLI (`sapphire-tally`) is tagged `v{version}`, the desktop app
# `desktop-v{version}` (release-plz.toml). Each gets its binaries built once
# release-plz has made its release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep the release command and the release PR from racing on the same branch.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
    uses: sapphire-turtle/.github/.github/workflows/release-plz.yml@v1
    with:
      # `cargo publish` builds the CLI, whose rustls pulls aws-lc-sys (cmake).
      linux-packages: cmake
    secrets: inherit

  build-cli:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-tally')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-tally'] }}
      target: cli

  build-desktop:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-tally-desktop')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-tally-desktop'] }}
      target: desktop
