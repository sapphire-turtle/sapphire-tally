[workspace]
members = [
    "cli",
    "crates/sapphire-tally-core",
    "crates/sapphire-tally-mcp",
    "desktop",
]
default-members = ["cli"]
resolver = "3"

[workspace.package]
description = "A stamp tracker with GitHub-style heatmaps built on sapphire-framework - file-based, local-first, made for human-agent collaboration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sapphire-turtle/sapphire-tally"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
grain-id = { version = "0.16", features = ["serde"] }
# The MCP macros name `rmcp` directly, so it is the version sapphire-framework
# builds on (`sapphire_framework::mcp::rmcp`): 3.5 in sapphire-framework 0.20.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros"] }
# The facade: `server` is the app server (AppServer, FrameworkCommand,
# SyncRuntime), `ipc` its transport, `mcp` the shared MCP tools with the `mcp`
# subcommand and `/mcp` over HTTP. `redb-store` must be named: with default
# features off the framework's persistent store silently falls back to
# in-memory otherwise.
sapphire-framework = { version = "0.20.0", default-features = false }
sapphire-frontmatter = { package = "sapphire-framework-frontmatter", version = "0.20.0" }
sapphire-workspace = { package = "sapphire-framework-workspace", version = "0.20.0", default-features = false }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 1
